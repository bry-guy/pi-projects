# pi-web worker as an OpenShell sandbox: the app is read-only, the project disk is the only writable data.
version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /usr, /lib, /proc, /dev/urandom, /etc, /var/log, /app]
  read_write: [/tmp, /dev/null, /data]
landlock:
  compatibility: best_effort
network_policies:
  npm:
    name: npm
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
        allow_encoded_slash: true
    binaries:
      - path: /usr/local/bin/node
